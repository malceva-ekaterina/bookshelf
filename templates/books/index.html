{% extends "base.html" %}
{% block title %}Books{% endblock title %}
{% block content %}
    <div class="search">
        <form method="get" class="row">
            <div class="col-4"><input type="search" name="q" value="{{ selected_query  }}" placeholder="Search.." class="form-control form-input"></div>
            <div class="col-3">
                <select name="genre" class="form-control form-input">
                    <option value="">-- All --</option>
                    {% for genre in genres %}
                        <option value="{{ genre.id }}" {% if genre.id == selected_genre %}selected{% endif %}>
                            {{ genre.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto"><button type="submit" class="btn green-btn"><i class="bi bi-search p-1"></i>Search</button></div>
        </form>
    </div>
    <hr>
    <div class="books">
        {% for book in books %}
            {% include "books/book_card.html"%}
        {% endfor %}    
    </div>
    
    
{% endblock content %}
